apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boilerplate.names.fullname" . }}
  labels:
    {{- include "boilerplate.labels.standard" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "boilerplate.labels.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "boilerplate.labels.standard" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "boilerplate.images.pullSecrets"
        ( dict
          "globalImagePullSecrets" .Values.global.imagePullSecrets
          "localImagePullSecrets" .Values.image.pullSecrets
        ) | nindent 6
      }}
      {{- if .Values.settings }}
      initContainers:
        - name: settings-init
          image: busybox:1.37
          command: ["/bin/sh", "-ec"]
          args:
            - |
              SRC="/template/settings.yml"
              DST="/etc/searxng/settings.yml"
              SECRET=""
              if [ -f "$DST" ]; then
                SECRET="$(sed -n 's/^.*secret_key:[[:space:]]*"\([^"]*\)".*$/\1/p' "$DST" | head -n 1)"
              fi
              if [ -z "$SECRET" ] || [ "$SECRET" = "ultrasecretkey" ]; then
                SECRET="$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9')"
              fi
              cp "$SRC" "$DST"
              sed -i "s/ultrasecretkey/$SECRET/g" "$DST"
              echo "settings.yml written (existing secret preserved)"
          volumeMounts:
            - name: data
              mountPath: /etc/searxng
            - name: settings
              mountPath: /template
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- include "boilerplate.images.image"
            ( dict
              "root" .
              "image" .Values.image
            ) | nindent 10
          }}
          {{- include "boilerplate.images.pullPolicy"
            ( dict
              "globalPullPolicy" .Values.global.imagePullPolicy
              "localPullPolicy" .Values.image.pullPolicy
            ) | nindent 10
          }}
          {{- include "boilerplate.environment.env" ( dict "root" . "env" .Values.env ) | indent 10 }}
          {{- include "boilerplate.environment.envFrom" ( dict "root" . "envFrom" .Values.envFrom ) | indent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort | default 8080 }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /etc/searxng
            {{- if .Values.limiter }}
            - name: limiter
              mountPath: /etc/searxng/limiter.toml
              subPath: limiter.toml
              readOnly: true
            {{- end }}
            {{- include "boilerplate.storage.extraVolumeMounts" . | indent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{ else }}{{ include "boilerplate.names.fullname" . }}-data{{ end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.settings }}
        - name: settings
          configMap:
            name: {{ include "boilerplate.names.fullname" . }}-settings
        {{- end }}
        {{- if .Values.limiter }}
        - name: limiter
          configMap:
            name: {{ include "boilerplate.names.fullname" . }}-limiter
        {{- end }}
        {{- include "boilerplate.storage.extraVolumes" . | indent 8 }}
