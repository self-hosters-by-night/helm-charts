{{- if .Values.secret.create }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "boilerplate.names.fullname" . }}
  labels:
    {{- include "boilerplate.labels.standard" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao-{{ .Chart.Name }}
  target:
    name: {{ include "boilerplate.names.fullname" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "A secret.path must be set to the OpenBao KV path holding the secret data" .Values.secret.path }}
{{- end }}
