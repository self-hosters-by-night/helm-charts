{{- if .Values.auth.enabled }}
{{- if and (not .Values.auth.existingSecret) (not .Values.auth.password) }}
{{- fail "valkey: auth.enabled requires either auth.password or auth.existingSecret" }}
{{- end }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boilerplate.names.fullname" . }}
  labels:
    {{- include "boilerplate.labels.standard" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.auth.password | required "valkey: auth.password is required when auth.enabled is true without auth.existingSecret" | b64enc | quote }}
{{- end }}
{{- end }}
