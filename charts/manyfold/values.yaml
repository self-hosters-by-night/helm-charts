# Global values for boilerplate compatibility
global:
  imageRegistry: ""
  imagePullPolicy: ""

image:
  registry: ghcr.io
  repository: manyfold3d/manyfold-solo
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

nodeSelector: {}
tolerations: []
affinity: {}

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

## @param env Environment variables to add to the container
# SECRET_KEY_BASE and the database password are provisioned through the
# External Secrets Operator from OpenBao (key shbn/manyfold) and injected
# from the release secret; do not set them here.
env:
  vars: {}
  fromConfigMap: {}
  # ENV_VAR_NAME:
  #     from: configmap-name
  #     key: configmap-key
  #     optional: false
  fromSecret:
    SECRET_KEY_BASE:
      from: '{{ include "boilerplate.names.fullname" . }}'
      key: SECRET_KEY_BASE
  # SECRET_NAME:
  #     from: secret-name
  #     key: secret-key
  #     optional: false

envFrom:
  configMaps: []
  # - name: s3-config

  secrets: []
  #  - name: s3-config

# Persistence configuration
persistence:
  config:
    enabled: true
    name: "config"
    mountPath: "/config"
    existingClaim: ""
    size: "1Gi"
    storageClass: ""
  libraries:
    enabled: true
    name: "libraries"
    mountPath: "/libraries"
    existingClaim: ""
    size: "10Gi"
    storageClass: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: manyfold.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: manyfold-tls
  #    hosts:
  #      - manyfold.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Probe the dedicated /health endpoint; / redirects (single-user auto-login
# bounce) which kubelet probes cannot follow to completion
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 60
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30

## @section Network Policy parameters
networkPolicy:
  ## @param networkPolicy.enabled Enable NetworkPolicy
  enabled: false
  ## @param networkPolicy.flavor Network policy flavor (kubernetes or cilium)
  ## Options: "kubernetes" or "cilium"
  flavor: "kubernetes"

# Additional volumes on the output Deployment definition.
extraVolumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
extraVolumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Valkey dependency configuration
# When enabled, deploys a Valkey instance and configures Manyfold's REDIS_URL
# to point at it. Required by the standard manyfold3d/manyfold image (Sidekiq);
# manyfold-solo bundles its own Redis instead.
valkey:
  enabled: false
  host: "" # Leave empty to auto-detect: <release-name>-valkey
  port: 6379
  database: 1
  # Full connection URL overriding host/port/database above.
  # Needed when the subchart has auth.enabled, e.g.
  # redis://:password@release-valkey:6379/1
  url: ""

# PostgreSQL dependency configuration
# When enabled, deploys a PostgreSQL instance and configures Manyfold to use it.
# Change image.repository to ghcr.io/manyfold3d/manyfold when enabling postgres.
postgres:
  enabled: false
  # Connection details used by the Manyfold app
  host: "" # Leave empty to auto-detect: <release-name>-postgres
  databaseName: manyfold
  databaseUser: manyfold
  # Existing secret containing DB credentials.
  # When set, the release secret (key "password") is ignored.
  existingSecret: ""
  existingSecretKeys:
    password: "password" # key in the secret holding the DB password
  # PostgreSQL subchart configuration
  env:
    vars:
      POSTGRES_USER: manyfold
      POSTGRES_DB: manyfold
      # Set POSTGRES_PASSWORD here when not using existingSecret.
      # When using existingSecret, configure env.fromSecret instead:
      # fromSecret:
      #   POSTGRES_PASSWORD:
      #     from: <secret-name>
      #     key: password
    fromSecret: {}
  persistence:
    enabled: true
    size: "5Gi"
    storageClass: ""

# Arbitrary extra Kubernetes manifests rendered as part of the release
# (e.g. a CNPG Cluster, NetworkPolicies). Each list item is a manifest object;
# Go templating is supported inside items.
extraManifests: []
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: example
  #   data:
  #     key: value
