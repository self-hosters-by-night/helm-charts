# Global values for boilerplate compatibility
global:
  imageRegistry: ""
  imagePullPolicy: ""

image:
  registry: ghcr.io
  repository: manyfold3d/manyfold-solo
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

nodeSelector: {}
tolerations: []
affinity: {}

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

## @param env Environment variables to add to the container
env:
  vars:
    SECRET_KEY_BASE: "CHANGE-ME-OR-USE-SECRET"
  fromConfigMap: {}
  # ENV_VAR_NAME:
  #     from: configmap-name
  #     key: configmap-key
  #     optional: false
  fromSecret: {}
  # SECRET_NAME:
  #     from: secret-name
  #     key: secret-key
  #     optional: false

envFrom:
  configMaps: []
  # - name: s3-config

  secrets: []
  #  - name: s3-config

# Persistence configuration
persistence:
  config:
    enabled: true
    name: "config"
    mountPath: "/config"
    existingClaim: ""
    size: "1Gi"
    storageClass: ""
  libraries:
    enabled: true
    name: "libraries"
    mountPath: "/libraries"
    existingClaim: ""
    size: "10Gi"
    storageClass: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: manyfold.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: manyfold-tls
  #    hosts:
  #      - manyfold.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30

# PostgreSQL dependency configuration
# When enabled, deploys a PostgreSQL instance and configures Manyfold to use it.
# Change image.repository to ghcr.io/manyfold3d/manyfold when enabling postgres.
postgres:
  enabled: false
  # Connection details used by the Manyfold app
  host: "" # Leave empty to auto-detect: <release-name>-postgres
  databaseName: manyfold
  databaseUser: manyfold
  # Existing secret containing DB credentials.
  # When set, databasePassword is ignored.
  existingSecret: ""
  existingSecretKeys:
    password: "password" # key in the secret holding the DB password
  # Used only when existingSecret is not set
  databasePassword: "CHANGE-ME"
  # PostgreSQL subchart configuration
  env:
    vars:
      POSTGRES_USER: manyfold
      POSTGRES_DB: manyfold
      # Set POSTGRES_PASSWORD here when not using existingSecret.
      # When using existingSecret, configure env.fromSecret instead:
      # fromSecret:
      #   POSTGRES_PASSWORD:
      #     from: <secret-name>
      #     key: password
    fromSecret: {}
  persistence:
    enabled: true
    size: "5Gi"
    storageClass: ""

# Additional volumes on the output Deployment definition.
extraVolumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
extraVolumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true
